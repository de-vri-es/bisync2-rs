name: CI
on:
  push: { branches: "main" }
  pull_request: { branches: "*" }

jobs:
  build_and_test:
    name:  rust-${{ matrix.rust }}
    strategy:
      matrix:
        rust: [stable, nightly]
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -Dwarnings
    steps:
      - name: Checkout code
        uses: actions/checkout@master
      - name: Install Rust ${{ matrix.rust }}
        run: |
          rustup install ${{ matrix.rust }} --profile minimal --component clippy
          rustup default ${{ matrix.rust }}
      - name: cargo build
        run: cargo build --release --all-features --all-targets --color=always
      - name: cargo test
        run: cargo test --release --all-features --all-targets --color=always
      - name: cargo clippy
        run: cargo clippy --release --all-features --all-targets --color=always
